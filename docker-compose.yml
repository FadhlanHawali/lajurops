name: open-planner

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      POSTGRES_DB: planner
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # start-dev + realm import for a ready-to-use local setup.
    # For production use `start` with TLS and a real hostname (see README).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: planner
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      # The URL browsers use; it also becomes the token issuer.
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-open-planner.json:/opt/keycloak/data/import/realm-open-planner.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: open-planner:latest
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://planner:${POSTGRES_PASSWORD:-planner}@postgres:5432/planner?sslmode=disable
      # Tokens are issued for the public (browser-facing) Keycloak URL...
      OIDC_ISSUER: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}/realms/open-planner
      # ...but the backend fetches signing keys over the internal network.
      OIDC_JWKS_URL: http://keycloak:8080/realms/open-planner/protocol/openid-connect/certs
      OIDC_CLIENT_ID: open-planner
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  pgdata:
