name: lajurops

services:
  # Database for the planner application
  planner-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${LAJUROPS_DB_PASSWORD:-planner}
      POSTGRES_DB: planner
    volumes:
      - planner-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Separate database for Keycloak
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # start-dev + realm import for a ready-to-use local setup.
    # For production use `start` with TLS and a real hostname (see README).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # The URL browsers use; it also becomes the token issuer.
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm import (client secret of lajurops-service).
      LAJUROPS_SERVICE_CLIENT_SECRET: ${LAJUROPS_SERVICE_CLIENT_SECRET:-dev-admin-secret-change-me}
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-lajurops.json:/opt/keycloak/data/import/realm-lajurops.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  app:
    build: .
    image: lajurops:latest
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://planner:${LAJUROPS_DB_PASSWORD:-planner}@planner-db:5432/planner?sslmode=disable
      # Tokens are issued for the public (browser-facing) Keycloak URL...
      OIDC_ISSUER: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}/realms/lajurops
      # ...but the backend talks to Keycloak over the internal network.
      OIDC_JWKS_URL: http://keycloak:8080/realms/lajurops/protocol/openid-connect/certs
      OIDC_CLIENT_ID: lajurops
      # User management through the Keycloak Admin API
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_ID: lajurops-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${LAJUROPS_SERVICE_CLIENT_SECRET:-dev-admin-secret-change-me}
      ADMIN_ROLE: lajurops-admin
      # Allow "import from URL" to reach private/internal addresses (off by default).
      IMPORT_ALLOW_PRIVATE_URLS: ${IMPORT_ALLOW_PRIVATE_URLS:-false}
    ports:
      - "8080:8080"
    depends_on:
      planner-db:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  planner-db:
  keycloak-db:
