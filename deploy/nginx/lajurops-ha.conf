# nginx in front of the LajurOps replicas (docker-compose.ha.yml).
#
# "app" resolves through Docker's DNS to every replica's address. Using a
# variable in proxy_pass makes nginx re-resolve it (every 5 s), so replicas
# that are added, restarted or replaced get traffic without reloading nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;
  # Workspace backups are imported as one request body.
  client_max_body_size 50m;

  location / {
    set $lajurops http://app:8080;
    proxy_pass $lajurops;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A replica that's down or restarting: try another one. (Requests that
    # already reached a replica aren't resent, so nothing runs twice.)
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;
    proxy_read_timeout 300s; # large exports and imports
  }
}
